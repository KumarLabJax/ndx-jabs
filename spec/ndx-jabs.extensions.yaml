groups:
- neurodata_type_def: ContourSeries
  neurodata_type_inc: TimeSeries
  doc: "Polygon contours outlining a segmented instance over time, as produced by
    JABS. Each frame holds a fixed number of contour slots, and 'vertex_count' gives
    the number of valid vertices in each slot, so trailing slots and trailing vertices
    are unused padding. More than one contour may be needed to describe an instance
    on a frame: an outer boundary plus one or more holes, or a body that an occluder
    splits into disjoint parts. Vertex positions are in the frame of reference described
    by 'reference_frame'. Name the series after the instance it describes and store
    it alongside the PoseEstimation for the same instance."
  datasets:
  - name: data
    dtype: numeric
    dims:
    - - num_frames
      - num_contours
      - num_vertices
      - x, y
    shape:
    - - null
      - null
      - null
      - 2
    doc: Contour vertex positions (x, y). Only the first 'vertex_count' vertices
      of each contour slot hold a position; the remaining values are padding and
      carry no meaning.
    attributes:
    - name: unit
      dtype: text
      default_value: pixels
      doc: Base unit of measurement for working with the data. The default value
        is 'pixels'. Actual stored values are not necessarily stored in these 
        units. To access the data in these units, multiply 'data' by 
        'conversion'.
      required: false
  - name: vertex_count
    dtype: uint32
    dims:
    - - num_frames
      - num_contours
    shape:
    - - null
      - null
    doc: Number of valid vertices in each contour slot. 0 means the slot holds 
      no contour on that frame. No count may exceed the number of vertices each 
      slot of 'data' holds.
  - name: is_external
    dtype: bool
    dims:
    - - num_frames
      - num_contours
    shape:
    - - null
      - null
    doc: True where the contour slot is an external boundary, i.e. an outer edge
      of the instance, and False where it is an internal boundary, i.e. a hole. 
      Has no meaning where 'vertex_count' is 0. A producer that retrieves only 
      outer boundaries sets this True throughout.
  - name: contour_group
    dtype: uint32
    dims:
    - - num_frames
      - num_contours
    shape:
    - - null
      - null
    doc: Index grouping contours into connected components within a frame. 
      Contours describing the same component share a value, and a hole carries 
      the value of the component that contains it, so an instance that an 
      occluder splits into disjoint parts keeps each hole with the part it 
      belongs to. Values are arbitrary labels that need only be distinct within 
      a frame, not indices into anything. Has no meaning where 'vertex_count' is
      0. Omit this dataset when the component structure is not known; a consumer
      can then attribute each hole to the smallest external contour containing 
      it, which is correct even when one component lies inside another's hole.
    quantity: '?'
  - name: reference_frame
    dtype: text
    doc: Description defining what the zero-position (0, 0) of the vertex 
      coordinates is and which way each axis increases, e.g. '(0, 0) is the top 
      left corner of the video frame, x increases rightward and y increases 
      downward'. Give the same frame of reference as the PoseEstimationSeries 
      objects describing the same instance.
